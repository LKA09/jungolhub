<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JungolHub</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main>
    <h1>JungolHub <small style="font-size:12px;font-weight:500;opacity:.6">v0.2.0</small></h1>
    <p class="sub">정올 정답 코드를 GitHub에 자동 저장합니다.</p>

    <label>
      GitHub Fine-grained PAT
      <input id="token" type="password" autocomplete="off" placeholder="github_pat_..." />
      <small>Repository contents: Read and write 권한이 필요합니다.</small>
    </label>

    <label>
      저장소
      <input id="repository" type="text" placeholder="LKA09/algorithm" />
    </label>

    <div class="row">
      <label>
        루트 폴더
        <input id="rootFolder" type="text" value="JUNGOL" />
      </label>
      <label>
        브랜치
        <input id="branch" type="text" placeholder="기본 브랜치" />
      </label>
    </div>

    <div class="buttons">
      <button id="save">저장</button>
      <button id="test" class="secondary">연결 테스트</button>
    </div>
    <p id="status" aria-live="polite"></p>

    <hr />
    <p class="help"><strong>디버그 로그</strong> — 문제 제출 후 아래 마지막 줄들을 보내주면 어느 단계에서 막혔는지 바로 확인할 수 있습니다.</p>
    <div class="buttons">
      <button id="refreshLogs" class="secondary">로그 새로고침</button>
      <button id="clearLogs" class="secondary">로그 지우기</button>
    </div>
    <pre id="debugLogs" style="white-space:pre-wrap;word-break:break-all;max-height:220px;overflow:auto;font-size:10px;line-height:1.45;background:#f6f8fa;padding:8px;border-radius:8px;border:1px solid #d0d7de">로그 없음</pre>
  </main>
  <script src="popup.js"></script>
</body>
</html>
